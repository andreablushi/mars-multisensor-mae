[project]
name = "mars-multisensor-mae"
version = "0.1.0"
description = "A multimodal, multisensor, multiresolution masked autoencoder over Mars remote sensing data."
readme = "README.md"
authors = [
    { name = "Andrea Blushi", email = "andreablushi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mars-multisensor-dataset @ https://github.com/andreablushi/mars-multisensor-dataset/archive/refs/heads/main.tar.gz",
    "mars-multisensor-benchmark @ https://github.com/andreablushi/mars-multisensor-benchmark/archive/refs/heads/main.tar.gz",
    "numpy>=2.5.2",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",
    "scikit-learn>=1.8",
    "torch>=2.14.0",
    "wandb>=0.22",
    "pillow>=13.0.0",
    "matplotlib>=3.10",
]

[tool.uv.sources]
mars-multisensor-dataset = { path = "../mars-multisensor-dataset", editable = true }
mars-multisensor-benchmark = { path = "../mars-multisensor-benchmark", editable = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "architecture",
    "benchmarking",
    "configs",
    "dataset",
    "evaluation",
    "logs",
    "training",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
digitalhub = [
    "digitalhub>=0.16,<0.17",
    "digitalhub-runtime-python>=0.16,<0.17",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
