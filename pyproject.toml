[project]
name = "mars-multisensor-mae"
version = "0.1.0"
description = "A multimodal, multisensor, multiresolution masked autoencoder over Mars remote sensing data."
readme = "README.md"
authors = [
    { name = "Andrea Blushi", email = "andreablushi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3,<2",
    "matplotlib>=3.10",
    "mars-multisensor-dataset @ https://github.com/andreablushi/mars-multisensor-dataset/archive/refs/heads/main.tar.gz",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "scikit-learn>=1.7",
    "torch>=2.14.0",
    "umap-learn>=0.5.7",
    "wandb>=0.22",
    "zarr>=3.3",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "architecture",
    "config",
    "dataset",
    "evaluation",
    "logs",
    "training",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "wandb-workspaces>=0.4.11",
]
digitalhub = [
    "digitalhub>=0.15,<0.16",
    "digitalhub-runtime-python>=0.15,<0.16",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
