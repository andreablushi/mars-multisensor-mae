# What a run submitted to DigitalHub is given, and what it publishes.

# The project every run and every published model belongs to.
project: mars-multisensor-features

# The repository the platform clones, and where that clone lands on the job.
repository: https://github.com/andreablushi/mars-multisensor-mae
source_root: /shared

# The image a job is built on, its extras what the platform itself asks for
python_version: PYTHON3_13
image_extras:
  - digitalhub>=0.15,<0.16
  - digitalhub-runtime-python>=0.15,<0.16

# Whether every stage queues on the shared pool rather than the reserved one,
# which marks each profile below with -shared.
shared: true

# What the platform gives each stage. A profile settles the cores, the GPU and
# the memory of the box: cpu, 1xrtxa5000 and 1xv100 exist on both pools, while
# up to 8xv100 and 3xrtxa5000 exist on the shared one alone. What is asked for
# here is what the job is scheduled on; the profile settles the limit it is
# killed at, which on 1xrtxa5000 is 13 cores and 59Gi of memory and of disk. The
# cores are also how many processes read features beside the training. The image
# build reads no GPU, so it names a profile alone.
resources:
  build:
    profile: cpu
  training:
    profile: 1xrtxa5000
    cpu: 8
    gpu: 1
    memory: 48Gi
    disk: 64Gi
  evaluation:
    profile: 1xrtxa5000
    cpu: 4
    gpu: 1
    memory: 32Gi
    disk: 64Gi

# The function each run is registered as, the project scoping it so it needs no prefix
functions:
  training: train-mae
  evaluation: evaluate-mae

# What each stage publishes, and what it reads that the dataset repository published.
publishes:
  dataset: dataset
  model: model
