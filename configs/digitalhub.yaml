# What a run submitted to DigitalHub is given, and what it publishes.

# The project every run and every published model belongs to.
project: mars-multisensor-features

# The repository the platform clones, and where that clone lands on the job.
repository: https://github.com/andreablushi/mars-multisensor-mae
source_root: /shared

# The image a job is built on, its extras what the platform itself asks for
python_version: PYTHON3_13
image_extras:
  - digitalhub>=0.15.11,<0.16
  - digitalhub-runtime-python>=0.15.2,<0.16

# Whether every stage queues on the shared pool, which marks each profile -shared.
shared: true

# What each stage gets: the profile settles the box, its cores are also the workers.
resources:
  build:
    profile: cpu
  training:
    profile: 1xrtxa5000
    cpu: 8
    gpu: 1
    memory: 48Gi
    disk: 64Gi
  evaluation:
    profile: 1xrtxa5000
    cpu: 4
    gpu: 1
    memory: 32Gi
    disk: 64Gi

# The function each run is registered as, the project scoping it so it needs no prefix
functions:
  training: train-mae
  evaluation: evaluate-mae

# What each stage publishes, and what it reads that the dataset repository published.
publishes:
  dataset: dataset
  model: model
  results: results
