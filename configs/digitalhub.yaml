# What a run submitted to DigitalHub is given.

# The project every run and every published model belongs to.
project: mars-multisensor-features

# The repository a job clones when it starts.
repository: https://github.com/andreablushi/mars-multisensor-mae

# The interpreter and the platform's own base image a job runs on, which installs
# requirements.txt from its clone with uv.
python_version: PYTHON3_13
base_image: python:3.13-slim

# What each stage is registered as and gets: a -shared profile queues on the shared
# pool, and the cores are also the workers reading tiles.
stages:
  training:
    function: train-mae
    profile: 1xrtxa5000-shared
    resources: {cpu: "10", gpu: "1", mem: 48Gi, disk: 64Gi}
  evaluation:
    function: evaluate-mae
    profile: 1xrtxa5000-shared
    resources: {cpu: "8", gpu: "1", mem: 32Gi, disk: 64Gi}

# The volume a run keeps its ready tiles on, mounted as the dataset root: a new one per
# run, so it starts empty and keeps each tile the first time it is read.
volume:
  volume_type: persistent_volume_claim
  name: mae-tiles
  mount_path: /volume
  spec: {size: 400Gi}
