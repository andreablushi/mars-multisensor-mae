# Build whose tiles SWIM labels, read with every label it has.
build: training

# Instruments the heads read.
instruments: ${model.instruments}

# Equal folds the labelled tiles are dealt into, by squares of block_deg degrees
# each dealt whole: the first tests, the second validates, the rest train.
folds: 10
block_deg: 10.0

# What the tile head reads of a tile, the GAP of its tokens or its CLS.
pooling: GAP

# Cross-attention blocks the map head's points read the tokens through.
segmenter_depth: 1

# How both heads are trained together, as a linear probe and fine-tuned.
finetune:
  # Tiles per batch, each cut to the training budget.
  batch_size: 32
  budget: ${dataset.budget}
  budget_scale: ${dataset.budget_scale}
  # Epochs of the whole schedule, each head kept at its best validation RMSE.
  epochs: 50
  # Epochs of warmup before the cosine decay.
  warmup_epochs: 5
  head_learning_rate: 0.001
  # Fine-tuning trains LoRA updates beside every encoder attention layer.
  lora_rank: 8
  lora_alpha: 16
  lora_learning_rate: 0.0001
  weight_decay: 0.05
  # Norm every step's gradient is clipped to.
  max_grad_norm: 1.0

# How every head is measured on the validation and test tiles.
evaluation:
  # Tiles per batch, each read whole.
  batch_size: 8
  # Test tiles drawn as SWIM's consistency beside the predicted, a row per depth,
  # over every observation of the instrument shown.
  tiles:
    mixed: b259_c0082
  shown: CTX
