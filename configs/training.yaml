# 50 passes over the training tiles, in batches of 128.
num_epochs: 50
# Steps in one epoch, a validation after each.
steps_per_epoch: 536
batch_size: 128
learning_rate: 0.0001
weight_decay: 0.05
# A fifteenth of the steps in warmup before the cosine decay.
warmup_steps: 1787
# Norm every step's gradient is clipped to.
max_grad_norm: 10.0


# Patches hidden from each instrument's encoder, each drawn alone (CSMAE's random
# correspondence).
masking:
  # Share of each instrument's patches hidden.
  mask_ratio: 0.5

# What latent UMR and CMR divide every cosine by, OlmoEarth's patch discrimination.
latent_temperature: 0.1

# CSMAE's MIM between instruments, pooled by GAP or CLS; no instruments, no MIM.
contrastive:
  pooling: GAP
  instruments: ${model.instruments}
  temperature: 0.5

# Whether the decoders read the acquisition angles the dataset lists.
acquisition: true
# Whether the encoders read them too; false conditions the decoders alone, as AlphaEarth.
acquisition_in_encoders: true

# Checkpoint folder.
checkpoints: checkpoints
