# 50 passes over the training tiles, in batches of 128.
num_epochs: 50
# Steps in one epoch, a validation after each.
steps_per_epoch: 536
batch_size: 128
learning_rate: 0.0001
weight_decay: 0.05
# A fifteenth of the steps in warmup before the cosine decay.
warmup_steps: 1787


# CSMAE's correspondence of hidden patches across instruments.
masking:
  # random_correspondence, identical_correspondence or multi_block.
  strategy: multi_block
  # Share of each instrument's patches hidden, of ground cells under identical correspondence.
  mask_ratio: 0.5
  # Ground cell side identical correspondence hides whole, MOLA's patch, in metres.
  cell_m: 926
  # Instruments identical correspondence still draws patch by patch.
  independent: []
  # Whether each training tile draws each instrument's share, random correspondence only.
  dynamic: false
  # The range a dynamic share is drawn uniform from.
  dynamic_range: [0.25, 0.75]
  # I-JEPA's target rectangles multi block hides per instrument and tile.
  blocks: 4
  # The range of each rectangle's share of the crop's extent.
  block_scale: [0.15, 0.2]
  # The range of each rectangle's north over east side, drawn log-uniform.
  aspect_range: [0.75, 1.5]

# I-JEPA's target encoder EMA momentum, linear from the first to the last step.
ema_momentum: [0.996, 1.0]

# What the detached pixel heads' UMR and CMR measure, MSE or RMSE.
reconstruction_error: RMSE

# CSMAE's MIM between instruments, pooled by GAP or CLS; no instruments, no MIM.
contrastive:
  pooling: GAP
  instruments: ${model.instruments}
  temperature: 0.5

# Whether the encoders and decoders read the acquisition angles the dataset lists.
acquisition: true

# Checkpoint folder.
checkpoints: checkpoints
