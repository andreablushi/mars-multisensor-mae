# How a run trains, validates and stops.

# A run is a fixed number of passes over the training split, as CSMAE trains, and
# its last checkpoint is the one kept.
epochs: 150
# How many tiles one step's gradient is averaged over, each cut to the dataset's
# budget.
batch_size: 128
learning_rate: 0.0003
weight_decay: 0.05
# How many epochs the rate climbs before the cosine decay.
warmup_epochs: 10

# How many epochs between two validations, a check that the loss still falls.
validate_every: 10

# The share of each instrument's patches hidden from its encoder, drawn independently.
mask_ratio: 0.5

# The instruments each instrument is rebuilt from cross-modally.
cmr:
  CTX: [CRISM, MOLA]
  CRISM: [CTX, MOLA]
  MOLA: [SHARAD, CTX, CRISM]
  SHARAD: [MOLA]

# The modules left as they are, named as the model holds them: encoders.MOLA.
frozen: []

# Where checkpoints land, relative to the repository.
checkpoints: checkpoints
