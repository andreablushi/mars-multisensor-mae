# 150 passes over the training tiles, in batches of 128.
num_steps: 16050
batch_size: 128
learning_rate: 0.0001
weight_decay: 0.05
# 10 passes of warmup before the cosine decay.
warmup_steps: 1070

# Steps between validations.
validate_every: 1070

# Share of each instrument's patches hidden from its encoder.
mask_ratio: 0.5

# What UMR and CMR measure, MSE, RMSE or RMSE+GRADIENT.
reconstruction_error: RMSE

# CSMAE's MIM between instruments, pooled by GAP or CLS; no instruments, no MIM.
contrastive:
  pooling: GAP
  instruments: ${model.instruments}
  temperature: 0.5

# Whether the encoders and decoders read the acquisition angles the dataset lists.
acquisition: true

# What the run trains: joint, every term at once; staged, num_steps of UMR alone, with
# no CMR, no MIM and no CLS of every instrument, then num_steps of every term on the
# encoders it trained, frozen, each stage logging its model.
stage: joint

# Checkpoint folder.
checkpoints: checkpoints
