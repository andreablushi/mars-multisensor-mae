# How a run trains, validates and stops.

# A run is counted in steps, so how long a split happens to be settles nothing.
max_steps: 10000
# How many tiles one step reads, each carrying every patch of its own.
batch_size: 6
learning_rate: 0.00015
weight_decay: 0.05
warmup_steps: 200

# How often the validation split is read, and how many of those may fail to beat
# the best before the run stops.
validate_every: 500
patience: 7

# The share of each instrument's patches hidden from its encoder, drawn independently.
mask_ratio: 0.5

# The instruments whose targets keep the instrument's own scale instead of each patch
# being normalised by itself, so a SHARAD delay window holding no echo stays quiet.
unnormalised_patches: [SHARAD]

# Where checkpoints land, relative to the repository.
checkpoints: checkpoints
