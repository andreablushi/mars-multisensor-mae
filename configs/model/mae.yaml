# The cross-sensor masked autoencoder: an encoder and a decoder per instrument,
# and one cross-sensor encoder between them.

name: mae

# The instruments read as tokens. MOLA is not one: it gives every surface patch
# its height, and a SHARAD patch carries its own.
instruments: [CTX, CRISM, SHARAD]
elevation: MOLA

# How far a cell of a feature's grid runs along the ground. A patch reaches
# every cell its span covers, so the finest instrument settles one cell and a
# coarser one spreads over the several it spans.
cell_m: 639.0

# The instrument encoders and the cross-sensor encoder.
dim: 384
heads: 6
depth: 4
crossencoder_depth: 2

# The decoders.
decoder_dim: 192
decoder_heads: 6
decoder_depth: 4
