# How a run trains, validates and stops.

epochs: 1000
batch_size: 32
learning_rate: 0.00015
weight_decay: 0.05
warmup_epochs: 5
patience: 10

# The share of each instrument's patches hidden from its encoder, the paper's
# random correspondence drawing each instrument's independently.
mask_ratio: 0.5

# What the contrastive term divides its similarities by.
temperature: 0.5

# How many processes read features beside the training.
workers: 8

# Where checkpoints land, relative to the repository.
checkpoints: checkpoints
