# @package _global_
# The third phase: the crossencoder learns again, slower, to hold CTX and CRISM too,
# every other choice the second phase's.

defaults:
  - surface
  - _self_

training:
  phase: shared
  crossencoder_rate: 0.1
  frozen:
    - encoders.MOLA
    - encoders.SHARAD
    - decoders.MOLA
    - decoders.SHARAD
