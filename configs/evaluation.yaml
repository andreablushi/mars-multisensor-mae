# How a trained model's latent space is read: every labelled tile of the evaluation
# build is embedded, and what its tokens come to is read against the class each tile
# carries.

# The build the labelled tiles are read from, published as dataset-<build>.
build: evaluation

# How far east or north, in metres, a token may be matched from where it sits.
# Null matches it anywhere in the other tile, so a distance does not follow how
# much of the tile each instrument happened to cover.
minimal_chamfer_distance_m: null
