# What a run reads of the published dataset, and how it cuts what it reads.

# The build to read, which is published as dataset-<build>.
build: training

# Where every build sits on this machine, under a directory of its own name, relative
# to the repository or absolute.
root: data/dataset

# The range each instrument's normalised values are clipped to, null leaving a side
# open and an instrument left out unclipped. SHARAD is gated at its noise floor in the
# dataset, and its cluttergram shares its scale and its range. CTX is clipped per scan
# in the dataset already, and MOLA holds no noise tail.
clip:
  CTX: [null, null]
  CRISM: [-6.0, 6.0]
  SHARAD: [null, null]
  MOLA: [null, null]

# How far a patch runs along an axis holding each thing, an axis left out taken
# whole. A tile is 32 km: a CTX or CRISM patch spans about 640 m of its ground, and a
# SHARAD one about 930 m along its track. Patches a tile are counted over the training build's index,
# median (90th percentile), before the empty corners of a crop are dropped.
patchsize:
  # A scan pooled to about 48 m a pixel by the dataset: 3362 (6384) patches a tile.
  CTX: {ground: 16}
  # A survey at about 200 m a pixel, its multispectral bands kept whole: 2014 (3684).
  CRISM: {ground: 3}
  # A gridded elevation at about 463 m a pixel: about 930 m, as a SHARAD patch: 1225
  # (1296).
  MOLA: {ground: 2}
  # A sounder walks one line, so its ground is traces about 465 m apart and its delay
  # is depth: 2926 (6790).
  SHARAD: {ground: 2, delay: 256}

# How many patches of each instrument a training or validation read keeps, the ones
# nearest a centre drawn on one of the tile's patches; evaluation reads tiles whole.
budget:
  # About 9 km square of one scan around the centre.
  CTX: 192
  # The same ground as CTX.
  CRISM: 192
  # The same ground as CTX.
  MOLA: 92
  # About 7 km of one track, every delay.
  SHARAD: 112

# The most a training batch's budget is multiplied by, drawn from 1 for each batch, so
# training sees crops up to twice as wide and evaluation's whole tiles stay closer to
# what was trained on. Validation keeps the budget as it is.
budget_scale: 4

# The shares the tiles are split into, in the code's order: train, validation.
split: [0.98, 0.02]

seed: 42
