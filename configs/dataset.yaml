# What a run reads of the published dataset, and how it cuts what it reads.

# The build to read, which is published as dataset-<build>.
build: training

# Where every build sits on this machine, under a directory of its own name.
root: data/dataset

# How far a patch runs along an axis holding each thing, an axis left out taken
# whole. A tile is 32 km, and every patch below spans about 2.5 km of its ground,
# so one patch means the same reach whichever instrument took it.
patchsize:
  # A scan at about 5 m a pixel, about 144 patches of a tile.
  CTX: {ground: 512}
  # A survey at about 200 m a pixel, its bands kept whole as the channels.
  CRISM: {ground: 12}
  # A sounder walks one line, so its ground is traces and its delay is depth.
  SHARAD: {ground: 8, delay: 256}

# How many ground samples of a patch are averaged into one along each ground axis,
# an instrument left out read whole.
pool:
  # 512 samples at about 5 m pooled to 64 at about 40 m.
  CTX: 8

# The shares the tiles are split into, in the code's order: train, validation.
split: [0.8, 0.2]

seed: 42
