# What a run reads of the published dataset, and how it cuts what it reads.

# The build to read, which is published as dataset-<build>.
build: training

# Where every build sits on this machine, under a directory of its own name, relative
# to the repository or absolute.
root: data/dataset

# What each instrument's values and the SHARAD clutter are normalised by, from the
# build's constants:
# zscore (mean and std) or minmax (min and max), per band where it has bands, and
# zscore-global or minmax-global for one value pooled over every band.
normalization:
  CTX: zscore
  CRISM: zscore
  SHARAD: zscore
  MOLA: zscore
  clutter: zscore

# The range each instrument's normalised values are clipped to, null leaving a side
# open and an instrument left out unclipped. SHARAD's bound sits 7 std under the mean,
# about -55 dB: below it lie only noise and dead traces, never an echo. CTX is clipped
# per scan in the dataset already, and MOLA holds no noise tail.
clip:
  CTX: [null, null]
  CRISM: [-6.0, 6.0]
  SHARAD: [-7.0, null]
  MOLA: [null, null]
  clutter: [null, null]

# How far a patch runs along an axis holding each thing, an axis left out taken
# whole. A tile is 32 km: a CTX or CRISM patch spans about 640 m of its ground, and a
# SHARAD one about 930 m along its track. Patches a tile are counted over the training build's index,
# median (90th percentile), before the empty corners of a crop are dropped.
patchsize:
  # A scan at about 5 m a pixel: 3362 (6384) patches a tile.
  CTX: {ground: 128}
  # A survey at about 200 m a pixel, its multispectral bands kept whole: about 1660
  # (2620), scaled from 12 pixel patches.
  CRISM: {ground: 3}
  # A gridded elevation at about 463 m a pixel: about 930 m, as a SHARAD patch.
  MOLA: {ground: 2}
  # A sounder walks one line, so its ground is traces about 465 m apart, and its
  # whole delay is read as the patch's channels: 209 (485).
  SHARAD: {ground: 2}

# How many ground samples of a patch are averaged into one along each ground axis,
# an instrument left out read whole.
pool:
  # 128 samples at about 5 m pooled to 16 at about 40 m.
  CTX: 8

# How many patches of each instrument a training or validation read keeps, the ones
# nearest a centre drawn on one of the tile's patches; evaluation reads tiles whole.
budget:
  # About 9 km square of one scan around the centre.
  CTX: 192
  # The same ground as CTX.
  CRISM: 192
  # The same ground as CTX.
  MOLA: 92
  # About the ground of CTX, over the tracks crossing it.
  SHARAD: 24

# The most a training batch's budget is multiplied by, drawn from 1 for each batch, so
# training sees crops up to twice as wide and evaluation's whole tiles stay closer to
# what was trained on. Validation keeps the budget as it is.
budget_scale: 4

# The shares the tiles are split into, in the code's order: train, validation.
split: [0.98, 0.02]

seed: 42
