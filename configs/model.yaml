# Instruments read as tokens.
instruments: [CTX, CRISM, MOLA, SHARAD]

# Instrument encoders and cross-sensor encoder.
encoder_dim: 384
encoder_heads: 6
encoder_depth: 4
crossencoder_depth: 2

# Decoders.
decoder_dim: 384
decoder_heads: 6
decoder_depth: 4

# Whether SHARAD's encoder reads the cluttergram.
clutter: false
# Whether the cluttergram also scales SHARAD's tokens (FiLM).
film: false
