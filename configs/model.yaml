# Instruments read as tokens.
instruments: [CTX, CRISM, MOLA, SHARAD]

# Instrument encoders and cross-sensor encoder.
encoder_dim: 768
encoder_heads: 12
encoder_depth: 10
crossencoder_depth: 2

# Decoders.
decoder_dim: 512
decoder_heads: 8
decoder_depth: 4

# MIM projector, a 2-layer MLP encoder_dim wide inside, from the tile vector to the vector MIM reads.
projector_dim: 128
