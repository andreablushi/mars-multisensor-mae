# An encoder and a decoder per instrument, one cross-sensor encoder between them.

# The instruments read as tokens, MOLA instead giving every surface patch the
# radargram row its echo lands on, so every patch is placed in delay alone.
instruments: [CTX, CRISM, SHARAD]
delay: MOLA

# How far a cell of a tile's grid runs, which the finest instrument's patch settles.
cell_m: 2560.0

# The instrument encoders, the cross-sensor encoder and the fusion, all one width.
encoder_dim: 384
encoder_heads: 6
encoder_depth: 4
crossencoder_depth: 2

# The decoders.
decoder_dim: 192
decoder_heads: 6
decoder_depth: 4
