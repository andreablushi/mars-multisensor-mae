# What a run reads of the published dataset, and how it cuts what it reads.

# The build to read, which is published as dataset-<build>.
build: training

# Where every build sits on this machine, under a directory of its own name.
root: data/dataset

# How far a patch runs along each cut axis, a wavelength axis kept whole as channels.
patchsize:
  # A scan at about 5 m a pixel, spanning 639 m, and one patch is one token.
  CTX: 128
  # A survey at about 200 m a pixel, its bands the channels, four across track.
  CRISM: 12
  # A radargram along one line, its other axis depth, so this is its delay bins too.
  SHARAD: 8

# The shares the tiles are split into, in the code's order: train, validation, test.
split: [0.8, 0.1, 0.1]

# The share of a draw taken over the anchor's ground, the rest from anywhere it reaches.
overlap: 0.25

seed: 42
