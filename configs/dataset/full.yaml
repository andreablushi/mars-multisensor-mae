# What a run reads of the published dataset, and how it cuts what it reads.

# The build to read, which is published as dataset-<build>.
build: full

# Where every build sits on this machine, under a directory of its own name. A
# build brought down whole fills it, and a build read from the platform fills it
# as it is read.
root: data/dataset

# How far a patch runs along every axis of an observation, for each instrument.
# A wavelength axis is kept whole, as the channels of the patch.
patchsize:
  # A scan at about 5 m a pixel. A patch is one token, so it runs no further
  # than a decoder can predict from the one vector it is read out of.
  CTX: 128
  # A survey at about 200 m a pixel, its bands the channels of a patch. It runs
  # 59 samples across track, so a wider patch never fits and none is cut.
  CRISM: 32
  # A radargram walks one line, and its other axis is depth rather than ground.
  SHARAD: 32

# The shares the features are split into, in the order the code names the
# splits: train, validation, test.
split: [0.8, 0.1, 0.1]

# How many classes a split must hold for the latent space to be measured over
# it. Each split is seeded with the commonest classes until it holds this many.
least_classes: 2

# The share of every other instrument's patches one draw holds over ground the
# anchor instrument's patches reach, the anchor being the one the feature holds
# fewest patches of. What is left over is drawn from anywhere it reaches.
overlap: 0.5

seed: 42
