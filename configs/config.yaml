# What a run reads, what it trains, and how, one file each, composed into one config.

defaults:
  - dataset@dataset
  - model@model
  - training@training
  - evaluation@evaluation
  - phase: dem_delay
  - _self_

# What this run is called, which groups its phases: the model each phase saves is
# published as <run_name>-<phase>, its tracked run named the same, and the evaluation
# reads the model of the phase it is composed with.
run_name: mae
