# What a run reads, what it trains, and how, one file each, composed into one config.

defaults:
  - dataset@dataset
  - model@model
  - training@training
  - evaluation@evaluation
  - phase: shared
  - _self_

# What this run is called, which names its tracked run, the model its last phase
# leaves, and that model's results. The evaluation builds the last phase's model.
# The part before a slash groups it: default/mae-small.
run_name: mae
