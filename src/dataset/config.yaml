# What a run reads of the published dataset, and how it cuts what it reads.

# The DigitalHub project the build is published in.
project: mars-multisensor-features

# The build to read, which is published as dataset-<build>.
build: small

# How many observations of each instrument a sample draws.
per_instrument: 4

# How many patches a sample draws of each of those observations.
per_observation: 64

# How far a patch runs along each kind of axis, for each instrument. An axis
# unlisted is kept whole, and an instrument unlisted is cut by the default.
tiles:
  default:
    ground: 16
  # A scan at about 6 m a pixel, so a wider patch still covers little ground.
  CTX:
    ground: 64
  # A survey at about 200 m a pixel, its 400 odd bands the channels of a patch.
  CRISM:
    ground: 16
  # A radargram walks one line, and its other axis is depth rather than ground.
  SHARAD:
    ground: 16
    elevation: 16
  # A gridded tile at about 460 m a pixel, and coarser still towards a pole.
  MOLA:
    ground: 16

# The share of a patch that must be measured for it to be kept.
keep_valid: 0.5

# How much of the fetched crops the run keeps on its own disk.
cache_gb: 32

# Where it keeps them, which a job is given a scratch directory for.
cache_dir: .cache/crops

# The shares the features are split into, and the number that fixes the split.
split:
  train: 0.8
  validation: 0.1
  test: 0.1
seed: 42
